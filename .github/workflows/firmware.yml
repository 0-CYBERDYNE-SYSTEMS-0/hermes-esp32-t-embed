name: Build T-Embed Hermes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check out pinned ESP-IDF
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-idf
          ref: 25fe69f946311abdaf9ad56591f25fedbc20ac98
          path: .esp-idf
          submodules: recursive

      - name: Cache ESP-IDF tools
        uses: actions/cache@v4
        with:
          path: ~/.espressif
          key: idf-${{ runner.os }}-${{ runner.arch }}-25fe69f946311abdaf9ad56591f25fedbc20ac98-esp32s3

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf cmake ninja-build ccache libffi-dev libssl-dev python3-venv libusb-1.0-0

      - name: Install ESP32-S3 tools
        run: .esp-idf/install.sh esp32s3

      - name: Build and export Hermes package
        shell: bash
        env:
          FIRMWARE_VERSION: ${{ github.sha }}
        run: |
          source .esp-idf/export.sh
          python3 tools/build_firmware.py --profile t-embed --version "$FIRMWARE_VERSION" --output artifacts

      - name: Upload flash package
        uses: actions/upload-artifact@v4
        with:
          name: hermes-t-embed-${{ github.sha }}
          path: artifacts/t-embed/
          if-no-files-found: error
          retention-days: 30
